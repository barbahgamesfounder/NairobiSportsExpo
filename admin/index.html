<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Leads | Nairobi Esports Expo Admin</title>
<style>
  :root {
    --bg: #08080b;
    --bg-alt: #121218;
    --surface: #17171f;
    --surface-2: #1d1d27;
    --border: #2a2a35;
    --text: #f5f5f7;
    --text-dim: #a3a3ad;
    --accent: #8b5cf6;
    --accent-bright: #a78bfa;
    --gold: #d4af37;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px 64px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .sub { color: var(--text-dim); font-size: 14px; margin: 0 0 24px; }
  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 20px;
  }
  input[type="search"], select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  input[type="search"] { min-width: 240px; }
  .stat-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 120px;
  }
  .stat .n { font-size: 20px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--text-dim); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  thead th {
    text-align: left;
    padding: 10px 12px;
    background: var(--surface-2);
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: .04em;
    cursor: pointer;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:hover { background: rgba(139,92,246,0.06); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: capitalize;
  }
  .badge.waitlist { background: rgba(139,92,246,0.18); color: var(--accent-bright); }
  .badge.partner_interest { background: rgba(212,175,55,0.18); color: var(--gold); }
  .badge.high { background: rgba(220,38,38,0.18); color: #f87171; }
  .badge.medium { background: rgba(212,175,55,0.18); color: var(--gold); }
  .badge.low { background: rgba(163,163,173,0.18); color: var(--text-dim); }
  .muted { color: var(--text-dim); }
  .wrap-table { overflow-x: auto; }
  .empty, .error, .loading { color: var(--text-dim); padding: 40px 0; text-align: center; }
  .error { color: #f87171; }
  .interest-tags { display: flex; flex-wrap: wrap; gap: 4px; max-width: 220px; }
  .interest-tag {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
    font-size: 11px;
    color: var(--text-dim);
  }
  a.mailto { color: var(--accent-bright); text-decoration: none; }
  a.mailto:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>Leads</h1>
<p class="sub">Nairobi Esports Expo — waitlist &amp; partner contacts</p>

<div class="stat-row" id="stats"></div>

<div class="toolbar">
  <input type="search" id="search" placeholder="Search name, email, organisation…">
  <select id="typeFilter">
    <option value="">All signup types</option>
    <option value="waitlist">Waitlist</option>
    <option value="partner_interest">Partner interest</option>
  </select>
  <select id="priorityFilter">
    <option value="">All priorities</option>
    <option value="high">High</option>
    <option value="medium">Medium</option>
    <option value="low">Low</option>
  </select>
</div>

<div id="content" class="loading">Loading leads…</div>

<script>
  let allLeads = [];
  let sortKey = 'created_at';
  let sortDir = 'desc';

  async function load() {
    try {
      const res = await fetch('/admin/leads');
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        document.getElementById('content').innerHTML = `<p class="error">${body.error || 'Failed to load leads'}</p>`;
        return;
      }
      const data = await res.json();
      allLeads = data.leads || [];
      renderStats();
      render();
    } catch (err) {
      document.getElementById('content').innerHTML = '<p class="error">Failed to load leads.</p>';
    }
  }

  function renderStats() {
    const total = allLeads.length;
    const waitlist = allLeads.filter(l => l.signup_type === 'waitlist').length;
    const partners = allLeads.filter(l => l.signup_type === 'partner_interest').length;
    const highPriority = allLeads.filter(l => l.lead_priority === 'high').length;
    document.getElementById('stats').innerHTML = [
      ['Total contacts', total],
      ['Waitlist', waitlist],
      ['Partner leads', partners],
      ['High priority', highPriority],
    ].map(([label, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${label}</div></div>`).join('');
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function matchesFilters(lead, q, type, priority) {
    if (type && lead.signup_type !== type) return false;
    if (priority && lead.lead_priority !== priority) return false;
    if (q) {
      const haystack = [lead.first_name, lead.last_name, lead.email, lead.organisation_name].join(' ').toLowerCase();
      if (!haystack.includes(q.toLowerCase())) return false;
    }
    return true;
  }

  function render() {
    const q = document.getElementById('search').value.trim();
    const type = document.getElementById('typeFilter').value;
    const priority = document.getElementById('priorityFilter').value;

    const rows = allLeads
      .filter(l => matchesFilters(l, q, type, priority))
      .sort((a, b) => {
        const av = a[sortKey], bv = b[sortKey];
        if (av === bv) return 0;
        const dir = sortDir === 'asc' ? 1 : -1;
        return av > bv ? dir : -dir;
      });

    const container = document.getElementById('content');
    if (!rows.length) {
      container.innerHTML = '<p class="empty">No leads match.</p>';
      return;
    }

    const cols = [
      ['created_at', 'Signed Up'],
      ['first_name', 'Name'],
      ['email', 'Email'],
      ['organisation_name', 'Organisation'],
      ['signup_type', 'Type'],
      ['lifecycle_status', 'Status'],
      ['lead_priority', 'Priority'],
      ['interests', 'Interests'],
      ['source', 'Source / UTM'],
    ];

    const thead = cols.map(([key, label]) =>
      `<th data-key="${key}">${escapeHtml(label)}${sortKey === key ? (sortDir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`
    ).join('');

    const tbody = rows.map((l) => {
      const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || '—';
      const interests = (l.partner_interests || [])
        .flatMap(pi => (pi.interest_type || '').split(',').map(s => s.trim()).filter(Boolean));
      const interestHtml = interests.length
        ? `<div class="interest-tags">${interests.map(i => `<span class="interest-tag">${escapeHtml(i)}</span>`).join('')}</div>`
        : '<span class="muted">—</span>';
      const utm = [l.utm_source, l.utm_medium, l.utm_campaign].filter(Boolean).join(' / ');
      return `<tr>
        <td>${new Date(l.created_at).toLocaleDateString()}</td>
        <td>${escapeHtml(name)}${l.job_title ? `<br><span class="muted">${escapeHtml(l.job_title)}</span>` : ''}</td>
        <td><a class="mailto" href="mailto:${encodeURIComponent(l.email)}">${escapeHtml(l.email)}</a>${l.phone ? `<br><span class="muted">${escapeHtml(l.phone)}</span>` : ''}</td>
        <td>${escapeHtml(l.organisation_name || '—')}${l.organisation_type ? `<br><span class="muted">${escapeHtml(l.organisation_type)}</span>` : ''}</td>
        <td><span class="badge ${escapeHtml(l.signup_type)}">${escapeHtml((l.signup_type || '').replace('_', ' '))}</span></td>
        <td>${escapeHtml(l.lifecycle_status || '—')}</td>
        <td>${l.lead_priority ? `<span class="badge ${escapeHtml(l.lead_priority)}">${escapeHtml(l.lead_priority)}</span> <span class="muted">(${l.lead_score})</span>` : '<span class="muted">—</span>'}</td>
        <td>${interestHtml}</td>
        <td class="muted">${escapeHtml(l.source || '—')}${utm ? `<br>${escapeHtml(utm)}` : ''}</td>
      </tr>`;
    }).join('');

    container.innerHTML = `<div class="wrap-table"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;

    container.querySelectorAll('th[data-key]').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.getAttribute('data-key');
        if (sortKey === key) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortKey = key;
          sortDir = 'desc';
        }
        render();
      });
    });
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('typeFilter').addEventListener('change', render);
  document.getElementById('priorityFilter').addEventListener('change', render);

  load();
</script>
</body>
</html>
